# Netlify deployment config.
#   - static frontend  -> served straight from ./public by Netlify's CDN
#   - /api/*           -> the Express app, running as one function
#
# REQUIRED: set TURSO_DATABASE_URL, TURSO_AUTH_TOKEN and JWT_SECRET under
# Site configuration -> Environment variables (the function crashes with 502
# without them). See DEPLOY.md.

[build]
  publish = "public"
  functions = "netlify/functions"
  command = "echo 'no build step'"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# SPA fallback (the app uses hash routing, so this rarely matters)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
