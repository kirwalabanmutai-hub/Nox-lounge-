<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Liquor POS</title>
  <!-- Precompiled Tailwind (13KB) - see `npm run build:css`. Replaces the old
       451KB runtime engine, which was recompiling styles on every screen
       change (Sell/Products/etc. rewrite the DOM constantly) and made
       navigation feel sluggish. Still fully offline - no CDN. -->
  <link rel="stylesheet" href="/css/tailwind.css" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body class="bg-slate-100 text-slate-800">

  <!-- LOGIN -->
  <div id="login-view" class="min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-sm bg-white rounded-2xl shadow-xl p-8">
      <div class="text-center mb-5">
        <div class="text-4xl">🍾</div>
        <h1 class="text-2xl font-bold mt-2">Nox Lounge POS</h1>
      </div>

      <!-- who's logging in -->
      <div id="role-tabs" class="grid grid-cols-2 gap-1 bg-slate-100 rounded-lg p-1 mb-4">
        <button type="button" class="role-tab active" data-role="admin">👤 Admin</button>
        <button type="button" class="role-tab" data-role="cashier">🧾 Cashier</button>
      </div>

      <!-- sign in vs. create account -->
      <div class="flex justify-center gap-5 mb-5">
        <button type="button" class="mode-tab active" data-mode="signin">Sign in</button>
        <button type="button" class="mode-tab" data-mode="register">Create account</button>
      </div>

      <form id="login-form" class="space-y-4">
        <div data-field="name" hidden>
          <label class="text-sm font-medium">Full name</label>
          <input name="name" autocomplete="name" class="input mt-1" />
        </div>
        <div>
          <label class="text-sm font-medium">Username</label>
          <input name="username" autocomplete="username" class="input mt-1" required />
        </div>
        <div>
          <label class="text-sm font-medium">Password</label>
          <input name="password" type="password" autocomplete="current-password" class="input mt-1" required />
        </div>
        <div data-field="confirm" hidden>
          <label class="text-sm font-medium">Confirm password</label>
          <input name="confirm" type="password" autocomplete="new-password" class="input mt-1" />
        </div>
        <p id="login-error" class="text-sm text-red-600 hidden"></p>
        <button id="login-submit" class="w-full bg-brand hover:bg-brand-dark text-white font-semibold rounded-lg py-2.5 transition">
          Sign in
        </button>
      </form>
    </div>
  </div>

  <!-- APP SHELL -->
  <div id="app-view" class="hidden min-h-screen md:flex">
    <aside class="bg-slate-900 text-slate-300 md:w-60 w-full md:min-h-screen flex md:flex-col">
      <div class="p-4 text-white font-bold text-lg flex items-center gap-2">🍾 <span class="hidden md:inline">Liquor POS</span></div>
      <nav id="nav" class="flex md:flex-col gap-1 px-2 pb-2 flex-1 overflow-x-auto"></nav>
      <div class="p-3 border-t border-slate-800 hidden md:block">
        <p id="who" class="text-sm font-medium text-white"></p>
        <p id="who-role" class="text-xs text-slate-400 capitalize"></p>
        <button id="logout" class="mt-2 text-xs text-red-400 hover:text-red-300">Log out</button>
      </div>
    </aside>
    <main id="content" class="flex-1 p-4 md:p-8 max-w-6xl mx-auto w-full"></main>
  </div>

  <!-- toast -->
  <div id="toast" class="fixed bottom-4 right-4 z-50 space-y-2"></div>

  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
